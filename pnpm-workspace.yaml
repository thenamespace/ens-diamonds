packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  bufferutil: true
  esbuild: true
  keccak: true
  lefthook: true
  sharp: true
  utf-8-validate: true

catalog:
  "@commitlint/cli": ^21.2.1
  "@commitlint/config-conventional": ^21.2.0
  "klarity": ^0.2.0
  "lefthook": ^2.1.10
  "oxfmt": ^0.61.0
  "oxlint": ^1.76.0
  "turbo": ^2.10.7

minimumReleaseAgeExclude:
  - "@types/react-dom@19.2.4"
  - "@types/react@19.2.18"
