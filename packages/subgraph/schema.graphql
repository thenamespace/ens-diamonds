type AcquisitionCommitted @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  ensCommitment: Bytes! # bytes32
  predictedSafe: Bytes! # address
  committedAt: BigInt! # uint256
  threshold: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AcquisitionExpired @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Claimed @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  member: Bytes! # address
  recipient: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Deposited @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  member: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type NameAcquired @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  labelhash: Bytes! # bytes32
  safe: Bytes! # address
  protocolPrice: BigInt! # uint256
  refundableBalance: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type VaultCancelled @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type VaultCreated @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  creator: Bytes! # address
  maxSpend: BigInt! # uint96
  registrationDuration: BigInt! # uint32
  owners: [Bytes!]! # address[]
  targetIntent: Bytes! # bytes32
  ensCommitment: Bytes! # bytes32
  creatorDeposit: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Withdrawn @entity(immutable: true) {
  id: Bytes!
  vaultId: Bytes! # bytes32
  member: Bytes! # address
  recipient: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
